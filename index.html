<style>

input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:4px 0 10px}
label{font-size:13px;color:var(--mute)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
